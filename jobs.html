<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Jobs - Bharat Rozgar Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <h1>Available Government Jobs</h1>
</header>

<main>

  <h2 class="section-title">Latest Government Jobs</h2>

  <!-- Search & Filter -->
  <div class="filter-bar">

    <input type="text" id="searchInput" placeholder="Search by title or department">

    <select id="categoryFilter">
      <option value="all">All Departments</option>
      <option value="Engineering">Engineering</option>
      <option value="IT">IT</option>
      <option value="Banking">Banking</option>
    </select>

  </div>

  <!-- Job List -->
  <section id="job-list" class="job-grid"></section>

  <!-- Pagination -->
  <div id="pagination"></div>

</main>

<footer>
  <p>© 2026 Bharat Rozgar Portal</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
