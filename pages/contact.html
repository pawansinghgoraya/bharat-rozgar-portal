<!DOCTYPE html>
<html lang="hi-IN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>संपर्क करें | भारत रोजगार पोर्टल</title>

<meta name="description" content="भारत रोजगार पोर्टल से संपर्क करें।">
<meta name="keywords" content="भारत रोजगार, सरकारी नौकरी, संपर्क">
<meta name="author" content="Bharat Rozgar Portal">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0b3d91">

<link rel="canonical" href="https://example.gov.in/contact.html">

<!-- Favicon -->
<link rel="icon" href="/bharat-rozgar-portal/assets/images/favicon.ico" type="image/x-icon">

<!-- Main CSS -->
<link rel="stylesheet" href="/bharat-rozgar-portal/css/style.css">

</head>

<body>

<!-- Skip Navigation (WCAG Required) -->
<a href="#main-content" class="skip-link">मुख्य सामग्री पर जाएँ</a>

<!-- Dynamic Header -->
<div id="header-placeholder" role="banner"></div>

<main id="main-content" class="container section" role="main">

<section class="contact-section" aria-labelledby="contact-heading">

<h1 id="contact-heading">संपर्क करें</h1>

<p class="section-description">
यदि आपके पास कोई प्रश्न, सुझाव या शिकायत है तो नीचे दिया गया फॉर्म भरें।
</p>

<!-- Alert Box -->
<div id="alertBox" class="form-alert" aria-live="polite" tabindex="-1"></div>

<form id="contactForm" novalidate autocomplete="off">

<!-- Honeypot Field (Spam Protection) -->
<div class="visually-hidden">
<label for="website">Website</label>
<input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
</div>

<!-- Name -->
<div class="form-group">
<label for="name">नाम <span aria-hidden="true">*</span></label>
<input type="text"
       id="name"
       name="name"
       required
       minlength="3"
       maxlength="50"
       aria-describedby="nameError">
<div id="nameError" class="error-text" role="alert"></div>
</div>

<!-- Email -->
<div class="form-group">
<label for="email">ईमेल <span aria-hidden="true">*</span></label>
<input type="email"
       id="email"
       name="email"
       required
       maxlength="100"
       aria-describedby="emailError">
<div id="emailError" class="error-text" role="alert"></div>
</div>

<!-- Phone -->
<div class="form-group">
<label for="phone">मोबाइल नंबर</label>
<input type="tel"
       id="phone"
       name="phone"
       pattern="[6-9]{1}[0-9]{9}"
       maxlength="10"
       aria-describedby="phoneError">
<div id="phoneError" class="error-text" role="alert"></div>
</div>

<!-- Message -->
<div class="form-group">
<label for="message">संदेश <span aria-hidden="true">*</span></label>
<textarea id="message"
          name="message"
          required
          minlength="10"
          maxlength="500"
          aria-describedby="messageError"></textarea>
<div id="messageError" class="error-text" role="alert"></div>
</div>

<!-- Submit -->
<div class="form-group">
<button type="submit" class="btn-primary">
संदेश भेजें
</button>
</div>

</form>

</section>

</main>

<!-- Dynamic Footer -->
<div id="footer-placeholder" role="contentinfo"></div>

<!-- JS Files -->
<script src="../js/layout.js" defer></script>
<script src="../js/contact.js" defer></script>

</body>
</html>
