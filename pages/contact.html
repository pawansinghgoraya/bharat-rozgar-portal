<!DOCTYPE html>
<html lang="hi-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>संपर्क करें | भारत रोजगार पोर्टल</title>

<meta name="description" content="भारत रोजगार पोर्टल से संपर्क करें।">

<link rel="stylesheet" href="/bharat-rozgar-portal/css/style.css">
</head>

<body>

<a href="#main-content" class="skip-link">Skip to Main Content</a>

<div id="header-placeholder"></div>

<main id="main-content" class="container section">

<div class="contact-box">

<h1>संपर्क करें</h1>

<div id="alertBox" aria-live="polite"></div>

<form id="contactForm" novalidate>

<input type="text" id="website" style="display:none">

<label for="name">नाम *</label>
<input type="text" id="name" required>
<div id="nameError" class="error-text"></div>

<label for="email">ईमेल *</label>
<input type="email" id="email" required>
<div id="emailError" class="error-text"></div>

<label for="phone">मोबाइल नंबर</label>
<input type="tel" id="phone">
<div id="phoneError" class="error-text"></div>

<label for="message">संदेश *</label>
<textarea id="message" required></textarea>
<div id="messageError" class="error-text"></div>

<button type="submit">संदेश भेजें</button>

</form>

</div>

</main>

<div id="footer-placeholder"></div>

<script src="../js/layout.js"></script>
<script src="../js/contact.js"></script>

</body>
</html>
