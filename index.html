<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bharat Rozgar Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Government Compliant Dynamic Job Portal">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Skip to Content -->
    <a href="#maincontent" class="skip-link">Skip to Main Content</a>

    <!-- Header -->
    <header>
        <h1>Bharat Rozgar Portal</h1>

        <nav aria-label="Main Navigation">
            <a href="index.html">Home</a>
            <a href="jobs.html">Jobs</a>
            <a href="admit_card.html">Admit Cards</a>
            <a href="results.html">Results</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main id="maincontent">

        <section aria-labelledby="latest-jobs">
            <h2 id="latest-jobs">Latest Government Jobs</h2>

            <!-- Search Bar -->
    <div class="search-section">
    <label for="searchInput">Search Jobs:</label>
    <input type="text" id="searchInput" placeholder="Search by title or department">
    </div>

            <!-- Filter Section -->
            <div class="filter-section">
                <label for="categoryFilter">Filter by Department:</label>
                <select id="categoryFilter">
                    <option value="all">All</option>
                    <option value="Engineering">Engineering</option>
                    <option value="IT">IT</option>
                    <option value="Banking">Banking</option>
                </select>
            </div>

            <!-- Jobs Container (ONLY ONE TIME) -->
            <div id="job-list" aria-live="polite"></div>

            <!-- Pagination -->
            <div id="pagination"></div>

        </section>

        <section>
            <h2>Recruitment Notice</h2>

            <img 
                src="assets/images/banner.jpg" 
                alt="Government Recruitment Notification Banner"
                width="100%">
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Bharat Rozgar Portal | All Rights Reserved.</p>
    </footer>

<script src="js/jobs.js"></script>
</body>
</html>
