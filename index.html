<!DOCTYPE html>
<html lang="en-IN">
<head>

<meta charset="UTF-8">
<title>Bharat Rozgar Portal | Government Jobs Updates</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Latest Government Jobs, Admit Cards, Results on Bharat Rozgar Portal.">

<meta name="theme-color" content="#0b3d91">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<a href="#maincontent" class="skip-link">
Skip to Main Content
</a>

<!-- HEADER -->

<header class="site-header">

<div class="container">

<h1 class="site-title">
<a href="index.html">Bharat Rozgar Portal</a>
</h1>

<nav class="main-nav" aria-label="Primary">

<ul>

<li><a href="index.html" aria-current="page">Home</a></li>
<li><a href="jobs.html">Jobs</a></li>
<li><a href="#">Admit Cards</a></li>
<li><a href="#">Results</a></li>
<li><a href="pages/contact.html">Contact</a></li>

</ul>

</nav>

</div>

</header>


<!-- MAIN -->

<main id="maincontent" class="container">

<div class="layout-grid">


<!-- SIDEBAR -->

<aside class="sidebar" aria-label="Job Filters">

<h2 class="sidebar-title">
Filter Jobs
</h2>

<div class="filter-box">

<label for="searchInput">
Search Jobs
</label>

<input
type="search"
id="searchInput"
placeholder="Search by job title">

</div>


<div class="filter-box">

<label for="departmentFilter">
Department
</label>

<select id="departmentFilter">

<option value="all">
All Departments
</option>

<option value="Engineering">
Engineering
</option>

<option value="IT">
IT
</option>

<option value="Banking">
Banking
</option>

<option value="Police">
Police
</option>

</select>

</div>

</aside>


<!-- MAIN CONTENT -->

<div class="main-content">

<section class="section">

<h2>
Latest Government Jobs
</h2>

<div
id="job-list"
class="job-grid"
aria-live="polite">
</div>

<nav
id="pagination"
aria-label="Job Pagination">
</nav>

</section>


<section class="section">

<h2>
Recruitment Notice
</h2>

<img
src="assets/images/banner.jpg"
alt="Government Recruitment Notice"
class="responsive-img">

</section>

</div>

</div>

</main>


<!-- FOOTER -->

<footer class="site-footer">

<div class="container">

<nav aria-label="Footer">

<ul class="footer-links">

<li><a href="#">About</a></li>
<li><a href="#">Disclaimer</a></li>
<li><a href="#">Privacy Policy</a></li>
<li><a href="#">Terms</a></li>
<li><a href="#">Contact</a></li>

</ul>

</nav>

<p>
© 2026 Bharat Rozgar Portal
</p>

</div>

</footer>

<script src="js/script.js"></script>

</body>
</html>
