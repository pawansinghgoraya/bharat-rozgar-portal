<!DOCTYPE html>
<html lang="hi-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | भारत रोजगार पोर्टल</title>

<meta name="description" content="भारत रोजगार पोर्टल से संपर्क करें।">

<style>
body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",Arial,sans-serif;
    background:#f4f6f9;
    color:#222;
}
header{
    background:#0b3d91;
    color:#fff;
    text-align:center;
    padding:18px;
}
main{
    max-width:1000px;
    margin:40px auto;
    padding:20px;
}
.contact-box{
    background:#fff;
    padding:30px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}
h2{
    margin-top:0;
    color:#0b3d91;
}
label{
    display:block;
    margin-top:15px;
    font-weight:600;
}
input,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:4px;
    font-size:14px;
}
input:focus,textarea:focus{
    border-color:#0b3d91;
    outline:none;
}
.error-text{
    color:#c00000;
    font-size:13px;
}
.success-box{
    background:#e6ffed;
    border-left:4px solid green;
    padding:10px;
    margin-top:15px;
}
.error-box{
    background:#ffecec;
    border-left:4px solid red;
    padding:10px;
    margin-bottom:15px;
}
button{
    margin-top:20px;
    padding:10px 20px;
    background:#0b3d91;
    color:#fff;
    border:none;
    cursor:pointer;
    border-radius:4px;
}
button:hover{
    background:#072c6b;
}
footer{
    background:#111;
    color:#fff;
    text-align:center;
    padding:15px;
    margin-top:40px;
}
</style>
</head>

<body>

<header>
<h1>संपर्क करें</h1>
<p>भारत रोजगार पोर्टल</p>
</header>

<main>
<div class="contact-box">

<h2>संपर्क फॉर्म</h2>

<div id="alertBox" aria-live="polite"></div>

<form id="contactForm" novalidate>

<!-- Honeypot Anti Spam -->
<input type="text" id="website" style="display:none">

<label for="name">नाम *</label>
<input type="text" id="name" required aria-required="true">
<div id="nameError" class="error-text"></div>

<label for="email">ईमेल *</label>
<input type="email" id="email" required aria-required="true">
<div id="emailError" class="error-text"></div>

<label for="phone">मोबाइल नंबर</label>
<input type="tel" id="phone" pattern="[6-9]{1}[0-9]{9}">
<div id="phoneError" class="error-text"></div>

<label for="message">संदेश *</label>
<textarea id="message" required aria-required="true"></textarea>
<div id="messageError" class="error-text"></div>

<button type="submit">संदेश भेजें</button>

</form>

</div>
</main>

<footer>
© 2026 भारत रोजगार पोर्टल | All Rights Reserved
</footer>

<script>
const form = document.getElementById("contactForm");
const alertBox = document.getElementById("alertBox");

form.addEventListener("submit", function(e){
    e.preventDefault();

    const nameError = document.getElementById("nameError");
    const emailError = document.getElementById("emailError");
    const phoneError = document.getElementById("phoneError");
    const messageError = document.getElementById("messageError");

    document.querySelectorAll(".error-text").forEach(el=>el.textContent="");
    alertBox.innerHTML="";

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const message = document.getElementById("message").value.trim();
    const honeypot = document.getElementById("website").value;

    let isValid = true;

    if(honeypot !== ""){
        return;
    }

    if(name === ""){
        nameError.textContent="नाम आवश्यक है।";
        isValid=false;
    }

    const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(!email.match(emailPattern)){
        emailError.textContent="सही ईमेल दर्ज करें।";
        isValid=false;
    }

    const phonePattern=/^[6-9]\d{9}$/;
    if(phone !== "" && !phone.match(phonePattern)){
        phoneError.textContent="सही 10 अंकों का मोबाइल नंबर दर्ज करें।";
        isValid=false;
    }

    if(message === ""){
        messageError.textContent="संदेश आवश्यक है।";
        isValid=false;
    }

    if(!isValid){
        alertBox.innerHTML='<div class="error-box">कृपया फॉर्म में त्रुटियाँ सुधारें।</div>';
        return;
    }

    alertBox.innerHTML='<div class="success-box">आपका संदेश सफलतापूर्वक प्राप्त हुआ। हम शीघ्र संपर्क करेंगे।</div>';
    form.reset();
});
</script>

</body>
</html>
